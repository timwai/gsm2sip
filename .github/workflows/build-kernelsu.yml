name: Build gsm2sip KernelSU module

on:
  push:
    branches:
      - kernelsu/thor-android15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build KernelSU module ZIP
        run: |
          chmod +x build-kernelsu.sh
          ./build-kernelsu.sh

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gsm2sip-kernelsu-thor-v1.4.18
          path: |
            dist/gsm2sip-kernelsu-thor-v1.4.18.zip
            dist/gsm2sip-kernelsu-thor-v1.4.18.zip.sha256
            dist/build-manifest.txt
          if-no-files-found: error
          retention-days: 30
