name: Build gsm2sip KernelSU module

on:
  push:
    branches:
      - kernelsu/thor-android15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build KernelSU module ZIP
        env:
          GSM2SIP_KEYSTORE_BASE64: ${{ secrets.GSM2SIP_KEYSTORE_BASE64 }}
          GSM2SIP_KEYSTORE_PASSWORD: ${{ secrets.GSM2SIP_KEYSTORE_PASSWORD }}
          GSM2SIP_KEY_ALIAS: ${{ secrets.GSM2SIP_KEY_ALIAS }}
          GSM2SIP_KEY_PASSWORD: ${{ secrets.GSM2SIP_KEY_PASSWORD }}
        run: |
          chmod +x build-kernelsu.sh gradlew
          ./build-kernelsu.sh

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gsm2sip-kernelsu-thor-v1.4.18-ksu2
          path: |
            dist/gsm2sip-kernelsu-thor-v1.4.18-ksu2.zip
            dist/gsm2sip-kernelsu-thor-v1.4.18-ksu2.zip.sha256
            dist/build-manifest.txt
          if-no-files-found: error
          retention-days: 30
